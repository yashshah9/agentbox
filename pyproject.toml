[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbox-sandbox"
version = "0.6.0"
description = "Self-hosted code execution sandbox for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yash Shah", email = "yash376351@gmail.com" }]
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "uvicorn[standard]>=0.29",
]

[project.urls]
Homepage = "https://github.com/yashshah9/agentbox"
Repository = "https://github.com/yashshah9/agentbox"
Issues = "https://github.com/yashshah9/agentbox/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
agentbox = "agentbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentbox"]
